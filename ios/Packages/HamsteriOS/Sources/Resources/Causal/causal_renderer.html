<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="mermaid.min.js"></script>
    <style>
      :root {
        color-scheme: light dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "SF Pro Text", sans-serif;
      }
      #root {
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        padding: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #diagram {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #diagram svg {
        max-width: 100%;
        max-height: 100%;
      }
      #error {
        display: none;
        color: #dc2626;
        text-align: center;
        font-size: 14px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="diagram"></div>
      <div id="error"></div>
    </div>
    <script>
      const diagramEl = document.getElementById("diagram");
      const errorEl = document.getElementById("error");

      function setError(message) {
        errorEl.style.display = "block";
        errorEl.textContent = message || "关系图渲染失败";
        diagramEl.style.display = "none";
      }

      function setDiagram(svg) {
        errorEl.style.display = "none";
        diagramEl.style.display = "flex";
        diagramEl.innerHTML = svg;
      }

      window.renderMermaid = async function renderMermaid(code, isDark) {
        try {
          mermaid.initialize({
            startOnLoad: false,
            securityLevel: "loose",
            theme: isDark ? "dark" : "default",
            flowchart: {
              useMaxWidth: true,
              curve: "basis",
            },
          });

          const graphDefinition = code && code.trim().length ? code : "flowchart TD\nstart[\"请先添加关系\"]";
          const renderId = `causal_${Date.now()}`;
          const { svg } = await mermaid.render(renderId, graphDefinition);
          setDiagram(svg);
        } catch (error) {
          setError(error && error.message ? error.message : String(error));
        }
      };
    </script>
  </body>
</html>
